schema: stele
operations:
  apply:
    guidance:
      - "Stele: before the first task, confirm the verification levels with the
        user as the approval step in the stele-plan skill describes."
      - "Stele: add @implements and @verifies anchors while writing code and
        tests, as the stele-verify skill describes."
      - "Stele: run `stele validate --change <change>` and fix failures before
        reporting the change done."
  archive:
    guidance:
      - "Stele: `stele validate --change <change>` must pass before archiving."
      - "Stele: after archiving, run `stele validate --specs`."
rules:
  verification:
    - "Stele: follow the stele-plan skill for levels, rationale, advisory
      placement, and the plan format."

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
