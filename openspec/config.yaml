schema: spec-driven

context: |
  This repository is a local showcase for a stable-ID verification layer on top of OpenSpec.
  Requirements and scenarios carry immutable Verification-ID metadata in their Markdown bodies.
  Code uses @implements requirement anchors and tests use @verifies scenario anchors.
  The Todo product and artifact dashboard are deliberately dependency-light Node/browser code.

rules:
  specs:
    - Give every requirement exactly one req.<namespace>.<12 hex> Verification-ID line.
    - Give every scenario exactly one scn.<namespace>.<12 hex> Verification-ID line.
    - Preserve IDs for modified or renamed behavior; never reuse retired IDs.
  tasks:
    - Include OpenSpec validation, automated tests, stable-ID verification, and browser review.

operations:
  apply:
    guidance:
      - Add requirement anchors at meaningful enforcement points and scenario anchors at actual tests.
      - Run npm run validate before marking implementation complete.
  archive:
    guidance:
      - Confirm Verification-ID metadata survives synchronization and archive before moving the change.
