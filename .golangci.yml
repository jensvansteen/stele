version: "2"

run:
  timeout: 5m
  tests: true
  build-tags:
    - integration

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  default: none
  enable:
    # Compile-time correctness and common bugs.
    - errcheck
    - errorlint
    - govet
    - ineffassign
    - nilerr
    - staticcheck
    - unused

    # Clear, idiomatic code without enforcing subjective complexity quotas.
    - asciicheck
    - bidichk
    - durationcheck
    - forcetypeassert
    - funlen
    - gocognit
    - gocritic
    - lll
    - misspell
    - modernize
    - nestif
    - nolintlint
    - predeclared
    - reassign
    - revive
    - unconvert
    - usestdlibvars
    - whitespace

  settings:
    funlen:
      lines: 80
      statements: 50
      ignore-comments: true
    gocognit:
      min-complexity: 20
    lll:
      line-length: 120
      tab-width: 4
    nestif:
      min-complexity: 5
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      confidence: 0.8

  exclusions:
    paths:
      - ^node_modules/
    rules:
      - path: _test\.go
        linters:
          - funlen
          - gocognit
          - nestif

formatters:
  enable:
    - gofumpt
    - goimports
  exclusions:
    paths:
      - ^node_modules/
