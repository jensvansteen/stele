name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check branch, pull request, and commit conventions
        if: github.event_name == 'pull_request'
        env:
          PR_BRANCH: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-conventions.mts ci
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          args: ./cmd/... ./internal/... ./tests/... ./tools/...
      - name: Check Go types and static analysis
        run: npm run typecheck:go
      - name: Lint and type-check TypeScript
        run: npm run lint:ts && npm run typecheck:ts
      - name: Enforce 100% TypeScript type coverage
        run: npm run type-coverage

  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Test, race-check, and enforce 100% core coverage
        run: npm test
      - name: Build documentation
        run: npm run docs:build
      - name: Verify packed npm boundary
        run: npm pack --dry-run

  # The two Stele gates run as their own Linux jobs, in parallel with the
  # tests: each takes about a minute, and neither needs the other's result.
  self-verify:
    name: Verify archived behavior with the published Stele
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify Stele's archived behavior with the published Stele
        run: npm run verify:self

  check-changes:
    name: Check changes with the Stele built from this commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check active changes and current specifications with the Stele built from this commit
        run: npm run stele -- check --all
